name: Android app build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare complete Capacitor web assets (LOCAL, not remote site)
        shell: bash
        run: |
          set -e
          rm -rf www
          mkdir -p www/native www/.well-known www/redefinir-senha www/reset-password
          FULL_COMMIT=79b2a12409f9465714832fb8f344b1fc37406475
          if [ -f index.html ] && grep -q 'screen-feed' index.html && [ "$(wc -c < index.html)" -gt 100000 ]; then
            cp index.html www/index.html
          else
            curl -fsSL "https://raw.githubusercontent.com/zacariasguilhermejoao-ui/tchilo-Pop/${FULL_COMMIT}/index.html" -o www/index.html
          fi
          test -s www/index.html
          grep -q 'screen-feed' www/index.html
          cp -a native/. www/native/
          for f in child-safety.html privacy.html terms.html about.html cookies.html community.html; do
            [ -f "$f" ] && cp "$f" "www/$f" || true
          done
          [ -f redefinir-senha/index.html ] && cp redefinir-senha/index.html www/redefinir-senha/index.html || true
          [ -f reset-password/index.html ] && cp reset-password/index.html www/reset-password/index.html || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/manifest.webmanifest || true
          if [ -f capacitor.config.json ]; then
            python3 -c "import json;p='capacitor.config.json';c=json.load(open(p));c.setdefault('server',{}).pop('url',None);json.dump(c,open(p,'w'),indent=2)"
          fi
          if ! grep -q 'native/offline-ui.css' www/index.html && [ -f www/native/offline-ui.css ]; then
            sed -i 's#</head>#<link rel="stylesheet" href="native/offline-ui.css"></head>#' www/index.html
          fi
          if [ -f www/manifest.webmanifest ] && ! grep -q 'manifest.webmanifest' www/index.html; then
            sed -i 's#</head>#<link rel="manifest" href="/manifest.webmanifest"></head>#' www/index.html
          fi
          for js in capacitor-bridge.js deezer-fetch.js music-android-patch.js boot-fast.js android-media-fix.js camera-tiktok.js legal-navbar-fix.js feed-noflicker.js feed-names-fix.js face-effects.js media-editor.js feed-stable.js post-music-feed.js feed-music-play.js story-music.js feed-stories-scroll.js music-use-sheet.js music-silence.js nav-layout.js video-preview.js password-toggle.js offline-cache.js reels-fast.js reels-follow-fix.js face-fx-pro.js feed-music-fix.js face-fx-deliver.js fx-png-effects.js chat-send-fix.js chat-audio-fix.js tchilo-deeplink.js tchilo-password-reset.js tchilo-share-target.js; do
            if [ -f "www/native/$js" ] && ! grep -q "native/$js" www/index.html; then
              sed -i "s#</body>#<script src=\"native/$js\"></script></body>#" www/index.html
            fi
          done
          if [ -d www/native/fx-one ]; then
            for js in www/native/fx-one/*.js; do
              bn=$(basename "$js")
              if ! grep -q "native/fx-one/$bn" www/index.html; then
                sed -i "s#</body>#<script src=\"native/fx-one/$bn\"></script></body>#" www/index.html
              fi
            done
          fi

      - name: Verify complete web payload
        shell: bash
        run: |
          set -e
          test -s www/index.html
          grep -q 'screen-feed' www/index.html
          test -s resources/icon.png
          test -s resources/splash.png
          test -s firebase/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon and splash
        run: npx @capacitor/assets generate --android --assetPath resources --splashBackgroundColor '#000000' --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: App Links + Share Target (SEND) intent-filters
        shell: bash
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          python3 << 'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text(encoding='utf-8')

          share_block = '''
                  <!-- Share Target: receber foto/vídeo/ficheiros de outras apps -->
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="image/*" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="video/*" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="*/*" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="image/*" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="video/*" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="*/*" />
                  </intent-filter>'''

          links_block = '''
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" android:host="tchilopop.com" android:pathPrefix="/redefinir-senha" />
                      <data android:scheme="https" android:host="tchilopop.com" android:pathPrefix="/reset-password" />
                      <data android:scheme="https" android:host="tchilopop.com" android:pathPrefix="/u" />
                      <data android:scheme="https" android:host="www.tchilopop.com" android:pathPrefix="/redefinir-senha" />
                      <data android:scheme="https" android:host="www.tchilopop.com" android:pathPrefix="/u" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="tchilo" android:host="redefinir-senha" />
                      <data android:scheme="tchilo" android:host="u" />
                  </intent-filter>'''

          needle = '</activity>'
          if 'android.intent.action.MAIN' not in t:
              raise SystemExit('MAIN activity not found')
          idx = t.find('android.intent.action.MAIN')
          close = t.find(needle, idx)
          if close < 0:
              raise SystemExit('no activity close')

          inject = ''
          if 'android.intent.action.SEND' not in t:
              inject += share_block
              print('SEND intent-filters will be injected')
          else:
              print('SEND already present')
          if 'tchilopop.com' not in t:
              inject += links_block
              print('App Links will be injected')
          else:
              print('App Links already present')

          if inject:
              t = t[:close] + inject + '\n        ' + t[close:]
              p.write_text(t, encoding='utf-8')
              print('manifest patched')
          else:
              print('no manifest changes needed')
          PY
          grep -n 'SEND\|tchilopop.com\|tchilo' "$MANIFEST" | head -50

      - name: Patch MainActivity for Share Target bridge
        shell: bash
        run: |
          set -e
          # Localizar MainActivity.java gerado pelo Capacitor
          MA=$(find android -name 'MainActivity.java' | head -n 1)
          test -n "$MA"
          echo "MainActivity: $MA"
          python3 << PY
          from pathlib import Path
          import re
          p = Path("$MA")
          t = p.read_text(encoding='utf-8')
          if 'TchiloShareBridge' in t:
              print('Share bridge already present')
              raise SystemExit(0)

          # Garantir imports
          imports = [
              'import android.content.Intent;',
              'import android.net.Uri;',
              'import android.os.Bundle;',
              'import android.util.Base64;',
              'import android.webkit.WebView;',
              'import java.io.InputStream;',
              'import java.io.ByteArrayOutputStream;',
              'import org.json.JSONArray;',
              'import org.json.JSONObject;',
          ]
          for imp in imports:
              if imp not in t:
                  t = t.replace('package ', imp + '\n\npackage ', 1) if False else t
                  # insert after package line
                  m = re.search(r'(package\s+[\w.]+;\s*)', t)
                  if m and imp not in t:
                      t = t[:m.end()] + '\n' + imp + t[m.end():]

          bridge_methods = r'''

    // --- Tchilo Share Target bridge ---
    private String pendingShareJson = null;

    private void handleShareIntent(Intent intent) {
        if (intent == null) return;
        String action = intent.getAction();
        if (action == null) return;
        boolean isSend = Intent.ACTION_SEND.equals(action) || Intent.ACTION_SEND_MULTIPLE.equals(action);
        if (!isSend) return;
        try {
            JSONObject payload = new JSONObject();
            String title = intent.getStringExtra(Intent.EXTRA_TITLE);
            String text = intent.getStringExtra(Intent.EXTRA_TEXT);
            String subject = intent.getStringExtra(Intent.EXTRA_SUBJECT);
            if (title != null) payload.put("title", title);
            else if (subject != null) payload.put("title", subject);
            else payload.put("title", "");
            payload.put("text", text != null ? text : "");
            payload.put("url", "");
            JSONArray files = new JSONArray();

            if (Intent.ACTION_SEND.equals(action)) {
                Uri stream = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                if (stream != null) {
                    JSONObject f = uriToJson(stream, intent.getType());
                    if (f != null) files.put(f);
                }
            } else if (Intent.ACTION_SEND_MULTIPLE.equals(action)) {
                java.util.ArrayList<Uri> list = intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                if (list != null) {
                    for (Uri u : list) {
                        JSONObject f = uriToJson(u, intent.getType());
                        if (f != null) files.put(f);
                    }
                }
            }
            payload.put("files", files);
            pendingShareJson = payload.toString();
            injectSharePayload();
        } catch (Exception e) {
            android.util.Log.e("TchiloShare", "handleShareIntent", e);
        }
    }

    private JSONObject uriToJson(Uri uri, String fallbackMime) {
        if (uri == null) return null;
        try {
            String mime = getContentResolver().getType(uri);
            if (mime == null || mime.isEmpty()) mime = fallbackMime != null ? fallbackMime : "application/octet-stream";
            String name = uri.getLastPathSegment();
            if (name == null) name = "shared";
            // limitar tamanho (~12MB base64)
            InputStream in = getContentResolver().openInputStream(uri);
            if (in == null) return null;
            ByteArrayOutputStream bos = new ByteArrayOutputStream();
            byte[] buf = new byte[8192];
            int n;
            int total = 0;
            int max = 12 * 1024 * 1024;
            while ((n = in.read(buf)) != -1) {
                total += n;
                if (total > max) {
                    in.close();
                    android.util.Log.w("TchiloShare", "file too large");
                    return null;
                }
                bos.write(buf, 0, n);
            }
            in.close();
            String b64 = Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
            JSONObject o = new JSONObject();
            o.put("name", name);
            o.put("mime", mime);
            o.put("dataUrl", "data:" + mime + ";base64," + b64);
            return o;
        } catch (Exception e) {
            android.util.Log.e("TchiloShare", "uriToJson", e);
            return null;
        }
    }

    private void injectSharePayload() {
        if (pendingShareJson == null) return;
        try {
            WebView webView = (WebView) this.bridge.getWebView();
            if (webView == null) return;
            final String json = pendingShareJson;
            // escapar para JS string
            String escaped = json
                .replace("\\", "\\\\")
                .replace("'", "\\'")
                .replace("\n", "\\n")
                .replace("\r", "");
            final String js =
                "(function(){try{var p=JSON.parse('" + escaped + "');" +
                "window.__tchiloSharePayload=p;" +
                "if(window.TchiloShareTarget&&window.TchiloShareTarget.handle){window.TchiloShareTarget.handle(p);}" +
                "else{try{window.dispatchEvent(new CustomEvent('tchilo-native-share',{detail:p}));}catch(e){}}" +
                "}catch(e){console.warn('TchiloShare inject',e);}})();";
            webView.post(new Runnable() {
                @Override public void run() {
                    webView.evaluateJavascript(js, null);
                }
            });
            // re-inject após load (SPA pode ainda não ter o script)
            webView.postDelayed(new Runnable() {
                @Override public void run() {
                    webView.evaluateJavascript(js, null);
                }
            }, 800);
            webView.postDelayed(new Runnable() {
                @Override public void run() {
                    webView.evaluateJavascript(js, null);
                    pendingShareJson = null;
                }
            }, 2000);
        } catch (Exception e) {
            android.util.Log.e("TchiloShare", "injectSharePayload", e);
        }
    }
'''

          # Inserir métodos antes do último fecho da classe
          last_brace = t.rfind('}')
          if last_brace < 0:
              raise SystemExit('no class end')
          t = t[:last_brace] + bridge_methods + '\n' + t[last_brace:]

          # Hook onCreate
          if 'super.onCreate' in t and 'handleShareIntent(getIntent())' not in t:
              t = t.replace(
                  'super.onCreate(savedInstanceState);',
                  'super.onCreate(savedInstanceState);\n        handleShareIntent(getIntent());',
                  1
              )

          # Hook onNewIntent
          if 'onNewIntent' not in t:
              # add method
              insert_at = t.rfind('// --- Tchilo Share Target bridge ---')
              on_new = '''
    @Override
    protected void onNewIntent(Intent intent) {
        super.onNewIntent(intent);
        setIntent(intent);
        handleShareIntent(intent);
    }
'''
              t = t[:insert_at] + on_new + t[insert_at:]

          p.write_text(t, encoding='utf-8')
          print('MainActivity patched for Share Target')
          PY

      - name: Set Android app version 1.1.0 (versionCode 2)
        shell: bash
        run: |
          set -e
          APP_BUILD=android/app/build.gradle
          test -f "$APP_BUILD"
          if grep -q 'versionName' "$APP_BUILD"; then
            sed -i 's/versionName "[^"]*"/versionName "1.1.0"/' "$APP_BUILD"
          else
            sed -i '/defaultConfig {/a\        versionName "1.1.0"' "$APP_BUILD"
          fi
          if grep -q 'versionCode' "$APP_BUILD"; then
            sed -i 's/versionCode [0-9]*/versionCode 2/' "$APP_BUILD"
          else
            sed -i '/defaultConfig {/a\        versionCode 2' "$APP_BUILD"
          fi

      - name: Ensure native config has NO remote server.url
        shell: bash
        run: |
          set -e
          CFG=android/app/src/main/assets/capacitor.config.json
          test -f "$CFG"
          python3 -c "import json;p='$CFG';c=json.load(open(p));c.setdefault('server',{}).pop('url',None);json.dump(c,open(p,'w'),indent=2);print(c.get('server'))"

      - name: Copy Firebase configuration
        shell: bash
        run: |
          set -e
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

      - name: Configure Google Services
        shell: bash
        run: |
          set -e
          ROOT_BUILD=android/build.gradle
          APP_BUILD=android/app/build.gradle
          if [ -f "$ROOT_BUILD" ] && ! grep -q 'com.google.gms:google-services' "$ROOT_BUILD"; then
            if grep -q "classpath 'com.android.tools.build:gradle" "$ROOT_BUILD"; then
              sed -i "/classpath 'com.android.tools.build:gradle/a\\    classpath 'com.google.gms:google-services:4.4.2'" "$ROOT_BUILD"
            fi
          fi
          if [ -f "$APP_BUILD" ] && ! grep -q "apply plugin: 'com.google.gms.google-services'" "$APP_BUILD"; then
            printf "\napply plugin: 'com.google.gms.google-services'\n" >> "$APP_BUILD"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tchilo-release.keystore
          test -s android/app/tchilo-release.keystore

      - name: Print release cert SHA256 for assetlinks.json
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          KS=android/app/tchilo-release.keystore
          echo "=== SHA256 fingerprint (copia para .well-known/assetlinks.json) ==="
          keytool -list -v -keystore "$KS" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" 2>/dev/null | grep -i 'SHA256:' || true

      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltam secrets de assinatura Android"
            exit 1
          fi
          KS="$PWD/app/tchilo-release.keystore"
          ./gradlew assembleRelease --stacktrace -Pandroid.injected.signing.store.file="$KS" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build signed release AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          KS="$PWD/app/tchilo-release.keystore"
          ./gradlew bundleRelease --stacktrace -Pandroid.injected.signing.store.file="$KS" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate signed artifacts
        id: arts
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          AAB=$(find android/app/build/outputs/bundle -name '*.aab' | head -n 1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-apk
          path: ${{ steps.arts.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-aab
          path: ${{ steps.arts.outputs.aab_path }}
          if-no-files-found: error
