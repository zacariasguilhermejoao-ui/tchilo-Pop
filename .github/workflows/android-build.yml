name: Android app build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android native permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = [
              'android.permission.CAMERA',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
          ]
          marker = '<application'
          additions = ''.join(f'    <uses-permission android:name="{x}" />\\n' for x in permissions)
          if marker in text:
              before, after = text.split(marker, 1)
              for x in permissions:
                  line = f'    <uses-permission android:name="{x}" />'
                  if line not in text:
                      before += line + '\\n'
              text = before + marker + after
          p.write_text(text)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
