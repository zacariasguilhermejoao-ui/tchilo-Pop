name: Android app build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare complete Capacitor web assets
        shell: bash
        run: |
          set -e
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp -a native/. www/native/
          if ! grep -q 'native/offline-ui.css' www/index.html; then
            sed -i 's#</head>#<link rel="stylesheet" href="native/offline-ui.css"></head>#' www/index.html
          fi
          for js in capacitor-bridge.js deezer-fetch.js music-android-patch.js boot-fast.js android-media-fix.js legal-navbar-fix.js feed-noflicker.js feed-names-fix.js face-effects.js media-editor.js feed-stable.js post-music-feed.js feed-music-play.js story-music.js feed-stories-scroll.js music-use-sheet.js music-silence.js nav-layout.js video-preview.js password-toggle.js offline-cache.js reels-fast.js reels-follow-fix.js face-fx-pro.js feed-music-fix.js face-fx-deliver.js; do
            if [ -f "www/native/$js" ] && ! grep -q "native/$js" www/index.html; then
              sed -i "s#</body>#<script src=\"native/$js\"></script></body>#" www/index.html
            fi
          done

      - name: Verify complete web payload
        shell: bash
        run: |
          set -e
          test -s www/index.html
          test -s www/native/boot-fast.js
          test -s www/native/deezer-fetch.js
          test -s resources/icon.png
          test -s resources/splash.png
          test -s firebase/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon and splash
        run: npx @capacitor/assets generate --android --assetPath resources --splashBackgroundColor '#000000' --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Firebase configuration
        shell: bash
        run: |
          set -e
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

      - name: Configure Google Services
        shell: bash
        run: |
          set -e
          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$PROJECT_GRADLE" ] && ! grep -q 'com.google.gms:google-services' "$PROJECT_GRADLE"; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
          fi
          if [ -f "$APP_GRADLE" ] && ! grep -q 'com.google.gms.google-services' "$APP_GRADLE"; then
            printf '\napply plugin: "com.google.gms.google-services"\n' >> "$APP_GRADLE"
          fi

      - name: Configure Android permissions
        shell: bash
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERMISSION in android.permission.CAMERA android.permission.ACCESS_COARSE_LOCATION android.permission.ACCESS_FINE_LOCATION android.permission.POST_NOTIFICATIONS android.permission.RECORD_AUDIO android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE; do
            if ! grep -q "$PERMISSION" "$MANIFEST"; then
              sed -i "/<application/i\\    <uses-permission android:name=\"$PERMISSION\" />" "$MANIFEST"
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tchilo-release.keystore
          test -s android/app/tchilo-release.keystore
          echo "Keystore OK"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltam secrets ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS ou ANDROID_KEY_PASSWORD"
            exit 1
          fi
          KS="$PWD/app/tchilo-release.keystore"
          test -s "$KS"
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build signed release AAB
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          KS="$PWD/app/tchilo-release.keystore"
          ./gradlew bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate signed artifacts
        id: arts
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          AAB=$(find android/app/build/outputs/bundle -name '*.aab' | head -n 1)
          echo "APK=$APK"
          echo "AAB=$AAB"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-apk
          path: ${{ steps.arts.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-aab
          path: ${{ steps.arts.outputs.aab_path }}
          if-no-files-found: error
