name: Android app build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare complete Capacitor web assets
        shell: bash
        run: |
          set -e
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp -a native/. www/native/
          if ! grep -q 'native/offline-ui.css' www/index.html; then
            sed -i 's#</head>#<link rel="stylesheet" href="native/offline-ui.css"></head>#' www/index.html
          fi
          for js in capacitor-bridge.js legal-navbar-fix.js feed-noflicker.js feed-names-fix.js face-effects.js media-editor.js feed-stable.js post-music-feed.js feed-music-play.js story-music.js feed-stories-scroll.js music-use-sheet.js music-silence.js nav-layout.js video-preview.js password-toggle.js offline-cache.js reels-fast.js reels-follow-fix.js face-fx-pro.js feed-music-fix.js; do
            if [ -f "www/native/$js" ] && ! grep -q "native/$js" www/index.html; then
              sed -i "s#</body>#<script src=\"native/$js\"></script></body>#" www/index.html
            fi
          done

      - name: Verify complete web payload
        shell: bash
        run: |
          set -e
          test -s www/index.html
          test -s resources/icon.png
          test -s resources/splash.png
          test -s firebase/google-services.json

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon and splash
        run: npx @capacitor/assets generate --android --assetPath resources --splashBackgroundColor '#000000' --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Firebase configuration
        shell: bash
        run: |
          set -e
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

      - name: Configure Google Services
        shell: bash
        run: |
          set -e
          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$PROJECT_GRADLE" ] && ! grep -q 'com.google.gms:google-services' "$PROJECT_GRADLE"; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
          fi
          if [ -f "$APP_GRADLE" ] && ! grep -q 'com.google.gms.google-services' "$APP_GRADLE"; then
            printf '\napply plugin: "com.google.gms.google-services"\n' >> "$APP_GRADLE"
          fi

      - name: Configure Android permissions
        shell: bash
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERMISSION in android.permission.CAMERA android.permission.ACCESS_COARSE_LOCATION android.permission.ACCESS_FINE_LOCATION android.permission.POST_NOTIFICATIONS android.permission.RECORD_AUDIO; do
            if ! grep -q "$PERMISSION" "$MANIFEST"; then
              sed -i "/<application/i\\    <uses-permission android:name=\"$PERMISSION\" />" "$MANIFEST"
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tchilo-release.keystore
          test -s android/app/tchilo-release.keystore
          echo "Keystore OK"

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltam secrets ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS ou ANDROID_KEY_PASSWORD"
            exit 1
          fi
          printf '%s\n' "storeFile=tchilo-release.keystore" "storePassword=${STORE_PASSWORD}" "keyAlias=${KEY_ALIAS}" "keyPassword=${KEY_PASSWORD}" > android/app/keystore.properties
          echo "keystore.properties OK"

      - name: Inject signing config into Gradle
        shell: bash
        run: |
          set -e
          APP_GRADLE="android/app/build.gradle"
          test -f "$APP_GRADLE"
          if grep -q "signingConfigs" "$APP_GRADLE"; then
            echo "signingConfigs already present"
            exit 0
          fi
          SIGN_SNIPPET_FILE="android/app/signing-snippet.gradle"
          cat > "$SIGN_SNIPPET_FILE" <<'SNIP'
              def keystorePropertiesFile = file("keystore.properties")
              def keystoreProperties = new Properties()
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              }
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties["storeFile"])
                          storePassword keystoreProperties["storePassword"]
                          keyAlias keystoreProperties["keyAlias"]
                          keyPassword keystoreProperties["keyPassword"]
                      }
                  }
              }
          SNIP
          # Insert snippet right after the first "android {" line
          awk '
            BEGIN { done=0 }
            {
              print
              if (!done && $0 ~ /^[[:space:]]*android[[:space:]]*\{/) {
                while ((getline line < snip) > 0) print line
                close(snip)
                done=1
              }
            }
          ' snip="$SIGN_SNIPPET_FILE" "$APP_GRADLE" > "$APP_GRADLE.tmp"
          mv "$APP_GRADLE.tmp" "$APP_GRADLE"
          rm -f "$SIGN_SNIPPET_FILE"
          # Attach signingConfig to release buildType (first occurrence of "release {")
          if ! grep -q "signingConfig signingConfigs.release" "$APP_GRADLE"; then
            sed -i '0,/release {/s//release {\n            signingConfig signingConfigs.release/' "$APP_GRADLE"
          fi
          echo "signingConfigs injected"
          grep -n "signingConfigs\|signingConfig" "$APP_GRADLE" | head -20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Locate signed artifacts
        id: arts
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          AAB=$(find android/app/build/outputs/bundle -name '*.aab' | head -n 1)
          echo "APK=$APK"
          echo "AAB=$AAB"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-apk
          path: ${{ steps.arts.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-aab
          path: ${{ steps.arts.outputs.aab_path }}
          if-no-files-found: error
