name: Android app build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          set -e
          rm -rf www
          mkdir -p www/native www/redefinir-senha www/reset-password
          if [ -f index.html ] && grep -q 'screen-feed' index.html && [ "$(wc -c < index.html)" -gt 100000 ]; then
            cp index.html www/index.html
          else
            curl -fsSL "https://raw.githubusercontent.com/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html" -o www/index.html
          fi
          test -s www/index.html
          cp -a native/. www/native/ || true
          [ -f redefinir-senha/index.html ] && cp redefinir-senha/index.html www/redefinir-senha/ || true
          [ -f reset-password/index.html ] && cp reset-password/index.html www/reset-password/ || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        run: npx @capacitor/assets generate --android --assetPath resources --splashBackgroundColor '#000000' --iconBackgroundColor '#000000' || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Firebase config
        run: |
          mkdir -p android/app
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          # Use preinstalled SDK on GitHub runner
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          # Accept licenses
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # Install required packages (no deprecated 'tools' package)
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

          echo "SDK packages ready"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
