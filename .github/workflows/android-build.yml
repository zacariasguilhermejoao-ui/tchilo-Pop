name: Android app build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Inject native bridge into index.html
        run: |
          if ! grep -q 'native/capacitor-bridge.js' index.html; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8', errors='replace')
          snippet = '''\n<script src="native/capacitor-bridge.js"></script>\n'''
          if '</body>' in html:
              html = html.replace('</body>', snippet + '</body>', 1)
              p.write_text(html, encoding='utf-8')
              print('capacitor-bridge.js injected into index.html')
          else:
              print('WARNING: </body> not found')
          PY
          else
            echo 'bridge already present'
          fi

      - name: Prepare Capacitor web assets
        run: |
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp native/capacitor-bridge.js www/native/capacitor-bridge.js
          echo "Prepared www/index.html and native bridge"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Firebase google-services.json
        run: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          echo "google-services.json copied to android/app/"

      - name: Apply Google Services Gradle plugin
        run: |
          PROJECT_GRADLE="android/build.gradle"
          if [ -f "$PROJECT_GRADLE" ]; then
            if ! grep -q "com.google.gms:google-services" "$PROJECT_GRADLE"; then
              sed -i "/dependencies {/a\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE" || true
            fi
          fi
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "" >> "$APP_GRADLE"
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          fi
          echo "Google Services plugin applied"

      - name: Set app icon and splash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          ICON=resources/icon.png
          SPLASH=resources/splash.png
          if [ -f "$ICON" ]; then
            for size_dens in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              s=${size_dens%:*}
              d=${size_dens#*:}
              dir="android/app/src/main/res/mipmap-${d}"
              mkdir -p "$dir"
              convert "$ICON" -resize ${s}x${s} "$dir/ic_launcher.png"
              convert "$ICON" -resize ${s}x${s} "$dir/ic_launcher_round.png"
              convert "$ICON" -resize ${s}x${s} "$dir/ic_launcher_foreground.png"
            done
            echo "App icons generated"
          fi
          if [ -f "$SPLASH" ]; then
            mkdir -p android/app/src/main/res/drawable
            convert "$SPLASH" -resize 1080x1920\> android/app/src/main/res/drawable/splash.png
            echo "Splash generated"
          fi

      - name: Configure Android native permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = [
              'android.permission.CAMERA',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
          ]
          marker = '<application'
          if marker in text:
              before, after = text.split(marker, 1)
              for x in permissions:
                  line = f'    <uses-permission android:name="{x}" />'
                  if line not in text:
                      before += line + '\n'
              text = before + marker + after
          p.write_text(text)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
