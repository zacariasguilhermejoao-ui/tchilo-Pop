name: Android app build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare complete Capacitor web assets
        shell: bash
        run: |
          set -e
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp -a native/. www/native/
          if ! grep -q 'native/offline-ui.css' www/index.html; then
            sed -i 's#</head>#<link rel="stylesheet" href="native/offline-ui.css"></head>#' www/index.html
          fi
          if ! grep -q 'native/capacitor-bridge.js' www/index.html; then
            sed -i 's#</body>#<script src="native/capacitor-bridge.js"></script></body>#' www/index.html
          fi
          if ! grep -q 'native/legal-navbar-fix.js' www/index.html; then
            sed -i 's#</body>#<script src="native/legal-navbar-fix.js"></script></body>#' www/index.html
          fi
          if ! grep -q 'native/feed-names-fix.js' www/index.html; then
            sed -i 's#</body>#<script src="native/feed-names-fix.js"></script></body>#' www/index.html
          fi

      - name: Verify complete web payload
        shell: bash
        run: |
          set -e
          test -s www/index.html
          test -s www/native/capacitor-bridge.js
          test -s www/native/offline-ui.css
          test -s www/native/legal-navbar-fix.js
          test -s www/native/feed-names-fix.js
          test -s resources/icon.png
          test -s resources/splash.png
          test -s firebase/google-services.json
          grep -q 'Camera' www/native/capacitor-bridge.js
          grep -q 'legal-from-login' www/native/legal-navbar-fix.js
          grep -q 'resolveAllFeedNames' www/native/feed-names-fix.js

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon and splash
        run: npx @capacitor/assets generate --android --assetPath resources --splashBackgroundColor '#000000' --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Firebase configuration
        shell: bash
        run: |
          set -e
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          test -s android/app/google-services.json

      - name: Configure Google Services
        shell: bash
        run: |
          set -e
          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$PROJECT_GRADLE" ] && ! grep -q 'com.google.gms:google-services' "$PROJECT_GRADLE"; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
          fi
          if [ -f "$APP_GRADLE" ] && ! grep -q 'com.google.gms.google-services' "$APP_GRADLE"; then
            printf '\napply plugin: "com.google.gms.google-services"\n' >> "$APP_GRADLE"
          fi

      - name: Configure Android permissions
        shell: bash
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERMISSION in \
            android.permission.CAMERA \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.POST_NOTIFICATIONS; do
            if ! grep -q "$PERMISSION" "$MANIFEST"; then
              sed -i "/<application/i\\    <uses-permission android:name=\"$PERMISSION\" />" "$MANIFEST"
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify Android outputs
        shell: bash
        run: |
          set -e
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
