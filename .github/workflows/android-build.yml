name: Android app build

"on":
  workflow_dispatch:
  push:
    branches:
      - main

env:
  TCHILO_VERSION_NAME: "1.3.0"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          set -e
          rm -rf www
          mkdir -p www/native www/redefinir-senha www/reset-password
          if [ -f index.html ] && grep -q 'screen-feed' index.html && [ "$(wc -c < index.html)" -gt 100000 ]; then
            cp index.html www/index.html
          else
            curl -fsSL "https://raw.githubusercontent.com/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html" -o www/index.html
          fi
          test -s www/index.html
          cp -a native/. www/native/ || true
          [ -f redefinir-senha/index.html ] && cp redefinir-senha/index.html www/redefinir-senha/ || true
          [ -f reset-password/index.html ] && cp reset-password/index.html www/reset-password/ || true
          [ -f manifest.webmanifest ] && cp manifest.webmanifest www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        run: npx @capacitor/assets generate --android --assetPath resources --splashBackgroundColor '#000000' --iconBackgroundColor '#000000' || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Enable BILLING permission
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          test -f "$M"
          if ! grep -q 'com.android.vending.BILLING' "$M"; then
            sed -i '0,/<manifest[^>]*>/s||&\n    <uses-permission android:name="com.android.vending.BILLING" />|' "$M"
            echo "BILLING injected"
          else
            echo "BILLING already present"
          fi
          grep -n BILLING "$M" || true

      - name: Bump version
        run: |
          set -e
          VC=$((1300 + ${{ github.run_number }}))
          VN="${{ env.TCHILO_VERSION_NAME }}"
          echo "versionCode=$VC versionName=$VN"
          echo "TCHILO_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          if [ -f android/app/build.gradle ]; then
            sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $VC/" android/app/build.gradle || true
            sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle || true
            grep -E 'versionCode|versionName' android/app/build.gradle || true
          fi

      - name: Setup release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "WARNING: keystore secrets missing - release will use debug key"
            echo "USE_UPLOAD_KEY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/tchilo-upload.jks
          test -s android/app/tchilo-upload.jks
          ls -la android/app/tchilo-upload.jks
          echo "USE_UPLOAD_KEY=1" >> "$GITHUB_ENV"
          echo "Upload keystore ready"

      - name: Copy Firebase config
        run: |
          mkdir -p android/app
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
          fi

      - name: Configure Gradle signing
        run: |
          set -e
          test -f android/app/build.gradle
          export USE_UPLOAD_KEY="${USE_UPLOAD_KEY:-0}"
          python3 scripts/patch-android-gradle.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Prepare Gradle
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> android/gradle.properties
          echo 'android.useAndroidX=true' >> android/gradle.properties
          echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Build APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug bundleRelease --stacktrace --info 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT" -ne 0 ]; then
            echo "========== FAILURE SUMMARY =========="
            grep -n -iE 'FAILURE:|What went wrong|\* What|Execution failed|Could not|error:|A problem|Caused by:|keystore|password|signing|R8|Missing class' /tmp/gradle.log | tail -120 || true
            echo "========== LAST 100 LINES =========="
            tail -100 /tmp/gradle.log || true
            exit "$EXIT"
          fi
          echo "Build OK"
          find app/build/outputs -name '*.apk' -o -name '*.aab' | while read f; do ls -lh "$f"; done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-android-release-aab-v1-3
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
