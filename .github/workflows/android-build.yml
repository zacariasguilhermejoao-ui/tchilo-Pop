name: Android app build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp native/capacitor-bridge.js www/native/capacitor-bridge.js
          cp native/offline-ui.css www/native/offline-ui.css

          if ! grep -q 'native/offline-ui.css' www/index.html; then
            sed -i 's#</head>#<link rel="stylesheet" href="native/offline-ui.css"></head>#' www/index.html
          fi

          if ! grep -q 'native/capacitor-bridge.js' www/index.html; then
            sed -i 's#</body>#<script src="native/capacitor-bridge.js"></script></body>#' www/index.html
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy Firebase configuration
        shell: bash
        run: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json

      - name: Configure Google Services
        shell: bash
        run: |
          PROJECT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"

          if [ -f "$PROJECT_GRADLE" ] && ! grep -q 'com.google.gms:google-services' "$PROJECT_GRADLE"; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
          fi

          if [ -f "$APP_GRADLE" ] && ! grep -q 'com.google.gms.google-services' "$APP_GRADLE"; then
            printf '\napply plugin: "com.google.gms.google-services"\n' >> "$APP_GRADLE"
          fi

      - name: Configure Android permissions
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text(encoding="utf-8")
permissions = [
    "android.permission.CAMERA",
    "android.permission.ACCESS_COARSE_LOCATION",
    "android.permission.ACCESS_FINE_LOCATION",
    "android.permission.POST_NOTIFICATIONS",
]

for permission in permissions:
    line = f'    <uses-permission android:name="{permission}" />'
    if line not in text:
        text = text.replace("<application", line + "\n    <application", 1)

path.write_text(text, encoding="utf-8")
PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
