name: Bump live v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_live_v3.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/patch_live_v3.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "live-btn-stable.js?v=3 (force 68px LIVE icon)"
            git push
          fi
