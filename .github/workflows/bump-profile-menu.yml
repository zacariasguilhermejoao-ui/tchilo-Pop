name: Bump profile-menu-fix cache
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/profile-menu-fix.js'
      - 'native/bump-profile-menu-v.py'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 native/bump-profile-menu-v.py
      - run: |
          git config user.name tchilo-bot
          git config user.email bot@tchilopop.com
          git add index.html
          git diff --staged --quiet || git commit -m "index: profile-menu-fix v=3 cache bust"
          git push
