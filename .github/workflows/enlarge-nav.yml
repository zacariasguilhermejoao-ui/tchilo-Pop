name: Enlarge nav icons

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_nav_icons.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply nav icon size patch
        run: |
          python3 scripts/patch_nav_icons.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Enlarge Feed nav icon to 40px (others 34px)"
            git push
          fi
