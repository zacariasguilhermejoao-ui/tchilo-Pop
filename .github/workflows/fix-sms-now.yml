name: Fix SMS now

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_sms_ui.py'
      - 'scripts/fix_sms_complete.py'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write complete SMS SVG + fix UI
        run: |
          if [ -f scripts/fix_sms_complete.py ]; then
            python3 scripts/fix_sms_complete.py || true
          fi
          python3 scripts/fix_sms_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sms-icon.svg index.html || true
          if ! git diff --cached --quiet; then
            git commit -m "FIX: complete SMS icon, remove broken text, restore messages nav"
            git push
          else
            echo "no changes"
          fi
