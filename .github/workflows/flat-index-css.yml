name: Embed flat CSS in index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_zzzb_index_flat_css.py'
      - 'scripts/patch_zzz_flatten_all.py'
      - 'scripts/patch_zzzc_system_titles.py'
      - '.github/workflows/flat-index-css.yml'

concurrency:
  group: flat-index-css
  cancel-in-progress: true

jobs:
  embed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply flat UI + system titles
        run: |
          set -e
          python3 scripts/patch_zzzb_index_flat_css.py || true
          python3 scripts/patch_zzz_flatten_all.py || true
          python3 scripts/patch_zzzc_system_titles.py
          echo "--- verify titles ---"
          grep -c "tchilo-system-titles" index.html || true
          grep -c "family=Anton" index.html || echo "Anton link gone"
          grep -c "font-family:'Anton'" index.html || echo "Anton CSS gone"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html native/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: system font on all titles (index + native)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
