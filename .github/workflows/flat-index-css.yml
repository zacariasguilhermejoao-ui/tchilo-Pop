name: Embed flat CSS in index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_zzz*.py'
      - 'native/tchilo-media-picker.js'
      - 'native/tchilo-create-bridge.js'
      - 'native/post-music-feed.js'
      - '.github/workflows/flat-index-css.yml'

concurrency:
  group: flat-index-css
  cancel-in-progress: true

jobs:
  embed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches
        run: |
          set -e
          for f in scripts/patch_zzz*.py; do
            echo "=== $f ==="
            python3 "$f" || echo "WARN $f"
          done
          grep -c 'tchilo-music-flat-v1' index.html || true
          grep -c 'background:#000' native/post-music-feed.js || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html native/
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix: flat full-screen black music UI"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
