name: Generate Tchilo SEO pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg (video thumbnails)
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - name: Generate public profile/post pages and sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-seo.mjs
      - name: Commit SEO changes
        run: |
          git config user.name "Tchilo SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-video.xml u/ post/ thumbs/
          git diff --cached --quiet || git commit -m "chore: update public SEO pages and sitemap"
          git push
