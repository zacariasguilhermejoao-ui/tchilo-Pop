name: Inject ads icon
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/tchilo-ads-icon-fix.js'
      - 'scripts/patch_inject_ads_icon.py'
      - '.github/workflows/inject-ads-icon.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch_inject_ads_icon.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "ui: ícone preto gestor de anúncios (Meus Anúncios)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
