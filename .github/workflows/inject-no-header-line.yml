name: Inject no-header-line script

on:
  workflow_dispatch:
  push:
    paths:
      - "native/tchilo-no-header-line.js"

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject script + strip post borders in index.html
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          t = p.read_text(encoding="utf-8", errors="replace")
          tag = '<script src="native/tchilo-no-header-line.js?v=2" defer></script>'
          if "tchilo-no-header-line.js" in t:
              t2, n = re.subn(
                  r'<script[^>]*tchilo-no-header-line\.js[^>]*></script>',
                  tag,
                  t,
                  count=3,
              )
              print("refreshed script tags", n)
              t = t2
          else:
              needle = "native/tchilo-thin-borders.css.js"
              i = t.find(needle)
              if i >= 0:
                  j = t.find("</script>", i)
                  t = t[: j + 9] + "\n" + tag + t[j + 9 :] if j > 0 else t.replace("</body>", tag + "\n</body>", 1)
              else:
                  t = t.replace("</body>", tag + "\n</body>", 1)
              print("inserted script")

          t = t.replace("border-bottom:3px solid var(--line);", "border-bottom:none;")
          t = t.replace("border-bottom:3px solid var(--line)", "border-bottom:none")
          t = t.replace("border:3px solid var(--ink);", "border:none;")
          t = t.replace("border:3px solid var(--ink)", "border:none")
          t = t.replace("border: 3px solid var(--ink);", "border:none;")
          t = t.replace("border:3px solid #0B0B0C;", "border:none;")
          t = t.replace("border:3px solid #000;", "border:none;")

          p.write_text(t, encoding="utf-8")
          print("index size", p.stat().st_size)
          assert "tchilo-no-header-line.js" in t
          print("post-media 3px left", t.count("border:3px solid var(--ink)"))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: remove post-media black borders + no-header-line v2"
            git push
          fi
