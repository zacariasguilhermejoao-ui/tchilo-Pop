name: Inject suggest script

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/tchilo-suggest-location-contacts.js'
      - 'scripts/patch_inject_suggest.py'
      - '.github/workflows/inject-suggest.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script into index.html
        run: python3 scripts/patch_inject_suggest.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: inject tchilo-suggest-location-contacts.js into index"
            git push
          fi
