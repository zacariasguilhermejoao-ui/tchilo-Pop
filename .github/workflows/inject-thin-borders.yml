name: Inject thin borders
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/tchilo-thin-borders.css.js'
      - 'scripts/patch_inject_thin_borders.py'
      - '.github/workflows/inject-thin-borders.yml'
permissions:
  contents: write
concurrency:
  group: inject-thin-borders
  cancel-in-progress: false
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch_inject_thin_borders.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "ui: inject tchilo-thin-borders into index"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
