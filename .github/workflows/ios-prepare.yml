name: iOS Capacitor preparation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prepare-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Copy Firebase GoogleService-Info.plist
        run: |
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          echo "GoogleService-Info.plist copied to ios/App/App/"

      - name: Set app icon and splash
        run: |
          ICON=resources/icon.png
          SPLASH=resources/splash.png

          if [ -f "$ICON" ]; then
            ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
            if [ -d "$ICONSET" ]; then
              sips -z 40 40 "$ICON" --out "$ICONSET/icon-20@2x.png" 2>/dev/null || true
              sips -z 60 60 "$ICON" --out "$ICONSET/icon-20@3x.png" 2>/dev/null || true
              sips -z 58 58 "$ICON" --out "$ICONSET/icon-29@2x.png" 2>/dev/null || true
              sips -z 87 87 "$ICON" --out "$ICONSET/icon-29@3x.png" 2>/dev/null || true
              sips -z 80 80 "$ICON" --out "$ICONSET/icon-40@2x.png" 2>/dev/null || true
              sips -z 120 120 "$ICON" --out "$ICONSET/icon-40@3x.png" 2>/dev/null || true
              sips -z 120 120 "$ICON" --out "$ICONSET/icon-60@2x.png" 2>/dev/null || true
              sips -z 180 180 "$ICON" --out "$ICONSET/icon-60@3x.png" 2>/dev/null || true
              sips -z 1024 1024 "$ICON" --out "$ICONSET/icon-1024.png" 2>/dev/null || true
              echo "iOS app icons generated"
            fi
          fi

          if [ -f "$SPLASH" ]; then
            mkdir -p ios/App/App/Assets.xcassets/Splash.imageset 2>/dev/null || true
            cp "$SPLASH" ios/App/App/Assets.xcassets/Splash.imageset/splash.png 2>/dev/null || true
            echo "iOS splash copied"
          fi

      - name: Configure iOS native privacy permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'tchilo-Pop precisa de acesso à câmera quando um recurso do aplicativo solicitar uma foto.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'tchilo-Pop precisa da sua localização quando um recurso do aplicativo utilizar localização.'" ios/App/App/Info.plist || true

      - name: Verify iOS project
        run: test -d ios/App && test -f ios/App/App.xcodeproj/project.pbxproj && test -f ios/App/App/Info.plist

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-project
          path: ios
