name: iOS Capacitor build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install dependencies
        run: npm install

      - name: Inject native bridge into index.html
        run: |
          if ! grep -q 'native/capacitor-bridge.js' index.html; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8', errors='replace')
          snippet = '\n<script src="native/capacitor-bridge.js"></script>\n'
          if '</body>' in html:
              html = html.replace('</body>', snippet + '</body>', 1)
              p.write_text(html, encoding='utf-8')
          PY
          fi

      - name: Prepare Capacitor web assets
        run: |
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp native/capacitor-bridge.js www/native/capacitor-bridge.js

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Copy Firebase GoogleService-Info.plist
        run: |
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

      - name: Configure iOS privacy permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'tchilo-Pop precisa de acesso à câmera quando solicitado.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'tchilo-Pop usa sua localização quando um recurso solicitar localização.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserNotificationUsageDescription string 'tchilo-Pop pode enviar notificações para informar sobre eventos do aplicativo.'" ios/App/App/Info.plist || true

      - name: Prepare iOS splash with app icon
        run: |
          ICON=resources/icon.png
          SPLASH=resources/splash.png
          mkdir -p ios/App/App/Assets.xcassets/Splash.imageset
          if [ -f "$SPLASH" ] && [ -f "$ICON" ]; then
            sips -s format png "$SPLASH" --out /tmp/tchilo-splash-base.png >/dev/null
            sips -Z 360 "$ICON" --out /tmp/tchilo-splash-icon.png >/dev/null
            cat > /tmp/tchilo-compose.swift <<'SWIFT'
          import Foundation
          import CoreGraphics
          import ImageIO
          import UniformTypeIdentifiers

          let args = CommandLine.arguments
          guard args.count == 4 else { exit(2) }
          let baseURL = URL(fileURLWithPath: args[1])
          let iconURL = URL(fileURLWithPath: args[2])
          let outURL = URL(fileURLWithPath: args[3])

          guard let baseSource = CGImageSourceCreateWithURL(baseURL as CFURL, nil),
                let iconSource = CGImageSourceCreateWithURL(iconURL as CFURL, nil),
                let baseImage = CGImageSourceCreateImageAtIndex(baseSource, 0, nil),
                let iconImage = CGImageSourceCreateImageAtIndex(iconSource, 0, nil) else { exit(1) }

          let width = 1080
          let height = 1920
          guard let ctx = CGContext(data: nil, width: width, height: height, bitsPerComponent: 8,
                                    bytesPerRow: width * 4, space: CGColorSpaceCreateDeviceRGB(),
                                    bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue) else { exit(1) }

          ctx.clear(CGRect(x: 0, y: 0, width: width, height: height))

          let bw = CGFloat(baseImage.width)
          let bh = CGFloat(baseImage.height)
          let scale = min(CGFloat(width) / bw, CGFloat(height) / bh)
          let drawW = bw * scale
          let drawH = bh * scale
          ctx.draw(baseImage, in: CGRect(x: (CGFloat(width)-drawW)/2, y: (CGFloat(height)-drawH)/2, width: drawW, height: drawH))

          let iw = CGFloat(iconImage.width)
          let ih = CGFloat(iconImage.height)
          let iconScale = min(360.0 / iw, 360.0 / ih)
          let iconW = iw * iconScale
          let iconH = ih * iconScale
          ctx.draw(iconImage, in: CGRect(x: (CGFloat(width)-iconW)/2, y: (CGFloat(height)-iconH)/2, width: iconW, height: iconH))

          guard let result = ctx.makeImage(),
                let dest = CGImageDestinationCreateWithURL(outURL as CFURL, UTType.png.identifier as CFString, 1, nil) else { exit(1) }
          CGImageDestinationAddImage(dest, result, nil)
          guard CGImageDestinationFinalize(dest) else { exit(1) }
          SWIFT
            swift /tmp/tchilo-compose.swift /tmp/tchilo-splash-base.png /tmp/tchilo-splash-icon.png ios/App/App/Assets.xcassets/Splash.imageset/splash.png
            echo "Splash iOS gerado com ícone centralizado."
          elif [ -f "$SPLASH" ]; then
            sips -s format png "$SPLASH" --out ios/App/App/Assets.xcassets/Splash.imageset/splash.png >/dev/null
            echo "Splash iOS gerado sem ícone porque o ícone não foi encontrado."
          else
            echo "Splash não encontrado; mantendo splash original."
          fi

      - name: Prepare iOS dependencies
        run: |
          if [ -f ios/App/Podfile ]; then
            echo "Podfile encontrado — instalando CocoaPods."
            cd ios/App
            pod install --repo-update
          else
            echo "Nenhum Podfile encontrado — usando o projeto iOS sem CocoaPods."
          fi

      - name: Select Xcode build container
        run: |
          if [ -f ios/App/App.xcworkspace ]; then
            echo "IOS_CONTAINER=-workspace App.xcworkspace" >> "$GITHUB_ENV"
          elif [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            echo "IOS_CONTAINER=-project App.xcodeproj" >> "$GITHUB_ENV"
          else
            echo "Projeto Xcode não encontrado."
            exit 1
          fi

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS archive
        run: |
          cd ios/App
          xcodebuild archive \
            $IOS_CONTAINER \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/tchilo-pop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH="$RUNNER_TEMP/tchilo-pop.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/App.app"
          cd "$RUNNER_TEMP"
          zip -qry tchilo-pop-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-unsigned-ipa
          path: ${{ runner.temp }}/tchilo-pop-unsigned.ipa
          if-no-files-found: error

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-xcarchive
          path: ${{ runner.temp }}/tchilo-pop.xcarchive
          if-no-files-found: error
