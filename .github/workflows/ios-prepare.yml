name: iOS Capacitor preparation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prepare-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Copy Firebase GoogleService-Info.plist
        run: |
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          echo "GoogleService-Info.plist copied to ios/App/App/"

      - name: Configure iOS native privacy permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'tchilo-Pop precisa de acesso à câmera quando um recurso do aplicativo solicitar uma foto.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'tchilo-Pop precisa da sua localização quando um recurso do aplicativo utilizar localização.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserNotificationUsageDescription string 'tchilo-Pop pode enviar notificações para informar sobre eventos do aplicativo.'" ios/App/App/Info.plist || true

      - name: Verify iOS project
        run: test -d ios/App && test -f ios/App/App.xcodeproj/project.pbxproj && test -f ios/App/App/Info.plist

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-project
          path: ios
