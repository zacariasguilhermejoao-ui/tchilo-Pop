name: iOS Capacitor build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install dependencies
        run: npm install

      - name: Inject native bridge into index.html
        run: |
          if ! grep -q 'native/capacitor-bridge.js' index.html; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8', errors='replace')
          snippet = '\n<script src="native/capacitor-bridge.js"></script>\n'
          if '</body>' in html:
              html = html.replace('</body>', snippet + '</body>', 1)
              p.write_text(html, encoding='utf-8')
          PY
          fi

      - name: Prepare Capacitor web assets
        run: |
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp native/capacitor-bridge.js www/native/capacitor-bridge.js

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Copy Firebase GoogleService-Info.plist
        run: |
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

      - name: Configure iOS privacy permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'tchilo-Pop precisa de acesso à câmera quando solicitado.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'tchilo-Pop usa sua localização quando um recurso solicitar localização.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserNotificationUsageDescription string 'tchilo-Pop pode enviar notificações para informar sobre eventos do aplicativo.'" ios/App/App/Info.plist || true

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS archive
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/tchilo-pop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH="$RUNNER_TEMP/tchilo-pop.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/App.app"
          cd "$RUNNER_TEMP"
          zip -qry tchilo-pop-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-unsigned-ipa
          path: ${{ runner.temp }}/tchilo-pop-unsigned.ipa
          if-no-files-found: error

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-xcarchive
          path: ${{ runner.temp }}/tchilo-pop.xcarchive
          if-no-files-found: error
