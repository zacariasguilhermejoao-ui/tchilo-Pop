name: iOS Capacitor build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf www
          mkdir -p www/native
          cp index.html www/index.html
          cp -a native/. www/native/

          if ! grep -q 'native/offline-ui.css' www/index.html; then
            sed -i '' 's#</head>#<link rel="stylesheet" href="native/offline-ui.css"></head>#' www/index.html
          fi

          if ! grep -q 'native/capacitor-bridge.js' www/index.html; then
            sed -i '' 's#</body>#<script src="native/capacitor-bridge.js"></script></body>#' www/index.html
          fi

          if ! grep -q 'native/legal-navbar-fix.js' www/index.html; then
            sed -i '' 's#</body>#<script src="native/legal-navbar-fix.js"></script></body>#' www/index.html
          fi

          if ! grep -q 'native/feed-names-fix.js' www/index.html; then
            sed -i '' 's#</body>#<script src="native/feed-names-fix.js"></script></body>#' www/index.html
          fi

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Copy Firebase GoogleService-Info.plist
        run: cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

      - name: Configure iOS privacy permissions
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'tchilo-Pop precisa de acesso à câmera quando solicitado.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'tchilo-Pop usa sua localização quando um recurso solicitar localização.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserNotificationUsageDescription string 'tchilo-Pop pode enviar notificações para informar sobre eventos do aplicativo.'" ios/App/App/Info.plist || true

      - name: Set splash image and app icon
        shell: bash
        run: |
          SPLASH=resources/splash.png
          ICON=resources/icon.png
          mkdir -p ios/App/App/Assets.xcassets/Splash.imageset

          if [ -f "$SPLASH" ]; then
            sips -s format png "$SPLASH" --out ios/App/App/Assets.xcassets/Splash.imageset/splash.png >/dev/null
            cat > ios/App/App/Assets.xcassets/Splash.imageset/Contents.json <<'JSON'
          {
            "images" : [
              { "filename" : "splash.png", "idiom" : "universal", "scale" : "1x" },
              { "idiom" : "universal", "scale" : "2x" },
              { "idiom" : "universal", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          fi

          if [ -f "$ICON" ]; then
            ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
            if [ -d "$ICONSET" ]; then
              sips -z 40 40 "$ICON" --out "$ICONSET/icon-20@2x.png" 2>/dev/null || true
              sips -z 60 60 "$ICON" --out "$ICONSET/icon-20@3x.png" 2>/dev/null || true
              sips -z 58 58 "$ICON" --out "$ICONSET/icon-29@2x.png" 2>/dev/null || true
              sips -z 87 87 "$ICON" --out "$ICONSET/icon-29@3x.png" 2>/dev/null || true
              sips -z 80 80 "$ICON" --out "$ICONSET/icon-40@2x.png" 2>/dev/null || true
              sips -z 120 120 "$ICON" --out "$ICONSET/icon-40@3x.png" 2>/dev/null || true
              sips -z 120 120 "$ICON" --out "$ICONSET/icon-60@2x.png" 2>/dev/null || true
              sips -z 180 180 "$ICON" --out "$ICONSET/icon-60@3x.png" 2>/dev/null || true
              sips -z 1024 1024 "$ICON" --out "$ICONSET/icon-1024.png" 2>/dev/null || true
            fi
          fi

      - name: Prepare iOS dependencies
        shell: bash
        run: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App
            pod install --repo-update
          fi

      - name: Select Xcode build container
        shell: bash
        run: |
          if [ -f ios/App/App.xcworkspace ]; then
            echo "IOS_CONTAINER=-workspace App.xcworkspace" >> "$GITHUB_ENV"
          elif [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            echo "IOS_CONTAINER=-project App.xcodeproj" >> "$GITHUB_ENV"
          else
            echo "iOS Xcode project not found"
            exit 1
          fi

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          cd ios/App
          xcodebuild archive \
            $IOS_CONTAINER \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/tchilo-pop.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          APP_PATH="$RUNNER_TEMP/tchilo-pop.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/App.app"
          cd "$RUNNER_TEMP"
          zip -qry tchilo-pop-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-unsigned-ipa
          path: ${{ runner.temp }}/tchilo-pop-unsigned.ipa
          if-no-files-found: error

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: tchilo-pop-ios-xcarchive
          path: ${{ runner.temp }}/tchilo-pop.xcarchive
          if-no-files-found: error
