name: Patch boot + login click fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_boot_login.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 scripts/patch_boot_login.py
      - name: Commit if changed
        run: |
          if git diff --quiet index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: boot único + botões login clicáveis (sem processar 2x)"
          git push
