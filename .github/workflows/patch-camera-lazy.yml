name: patch-camera-lazy
on:
  push:
    paths:
      - 'native/camera-tiktok.js'
      - 'scripts/patch_camera_lazy.py'
      - '.github/workflows/patch-camera-lazy.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch camera-tiktok
        run: python3 scripts/patch_camera_lazy.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add native/camera-tiktok.js
          git diff --staged --quiet || git commit -m "fix: camera-tiktok — MediaPipe só ao escolher efeito (não no boot)"
          git push || true
