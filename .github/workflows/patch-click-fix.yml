name: Inject click-fix into index
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/patch-click-fix-index.py'
      - '.github/workflows/patch-click-fix.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject
        run: python3 native/patch-click-fix-index.py
      - name: Commit
        run: |
          git config user.name tchilo-bot
          git config user.email bot@tchilopop.com
          git add index.html
          git diff --staged --quiet || git commit -m "index: CRITICAL click-fix - force icon clicks, kill overlays"
          git push
