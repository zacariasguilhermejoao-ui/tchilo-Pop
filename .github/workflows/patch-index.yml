name: Patch index.html fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/patch-index.yml'

concurrency:
  group: patch-index-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run safe patch scripts only
        run: |
          for f in scripts/patch_*.py; do
            base=$(basename "$f")
            case "$base" in
              patch_plus_button_pro.py|patch_restore_*|patch_assemble_*|patch_zzz_flatten_all.py|patch_zzzb_index_flat_css.py)
                echo "skip $base (run ordered at end)"
                continue
                ;;
            esac
            echo "=== $f ==="
            python3 "$f" || echo "WARN $f"
          done
          python3 scripts/patch_zzz_flatten_all.py || true
          python3 scripts/patch_zzzb_index_flat_css.py || true
          python3 scripts/patch_zzzc_system_titles.py || true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: index + native patches"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || true
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
