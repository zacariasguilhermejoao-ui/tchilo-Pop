name: Patch index.html fixes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_*.py'
      - '.github/workflows/patch-index.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run all patch scripts
        run: |
          for f in scripts/patch_*.py; do
            echo "=== $f ==="
            python3 "$f" || true
          done

      - name: Commit if changed
        run: |
          if git diff --quiet index.html; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: apply index.html patches (logout, legal nav, etc.)"
            git push
          fi
