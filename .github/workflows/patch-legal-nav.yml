name: Patch legal navbar hide in index.html

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/patch_legal_nav.py'
      - '.github/workflows/patch-legal-nav.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: python3 scripts/patch_legal_nav.py

      - name: Commit if changed
        run: |
          if git diff --quiet index.html; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "fix: hide bottom navbar on Terms/Privacy in index.html"
            git push
          fi
