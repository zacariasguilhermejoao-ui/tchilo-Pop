name: Patch login in index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-login-index.yml'
      - 'native/legal-navbar-fix.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply login fixes to index.html
        run: |
          python3 << 'PY'
          h=open('index.html').read()
          orig=len(h)
          changed=False

          old='''async function tchiloSupabaseLogin(identifier,password){\n  let email=identifier;\n  if(!isValidEmail(identifier)){\n    throw new Error('Para entrar, usa o email da conta.');\n  }\n  const {data,error}=await tchiloSupabase.auth.signInWithPassword({email,password});\n  if(error) throw error;\n  const {data:profile,error:profileError}=await tchiloSupabase.from('profiles').select('*').eq('id',data.user.id).maybeSingle();\n  if(profileError || !profile) throw new Error('Perfil da conta n\xe3o encontrado.');\n  setSession({id:profile.id,username:profile.username,email:data.user.email||'',displayName:profile.display_name||profile.username,avatar:profile.avatar_url||null,privateAccount:!!profile.is_private,anonymousMode:!!profile.anonymous_mode});\n  hideLoginGate();\n  showToast('Ol\xe1, '+profile.username+'!');\n}'''

          # Try with proper unicode
          old=open('index.html').read()
          # re-read
          h=open('index.html').read()

          marker="if(profileError || !profile) throw new Error("
          if marker in h and "__tchiloJustLoggedIn=true" not in h:
            import re
            # Replace entire login function via regex
            pat=r'async function tchiloSupabaseLogin\(identifier,password\)\{[\s\S]*?showToast\([^)]+\);\n\}'
            new=r'''async function tchiloSupabaseLogin(identifier,password){
  let email=String(identifier||'').trim().toLowerCase();
  if(!isValidEmail(email)){
    throw new Error('Para entrar, usa o email da conta (n\xe3o o @username).');
  }
  const {data,error}=await tchiloSupabase.auth.signInWithPassword({email:email,password:password});
  if(error){
    var msg=error.message||'N\xe3o foi poss\xedvel iniciar sess\xe3o.';
    if(/invalid login|invalid credentials|invalid_credentials/i.test(msg)) msg='Email ou palavra-passe incorretos.';
    if(/email not confirmed/i.test(msg)) msg='Confirma o teu email antes de entrar.';
    throw new Error(msg);
  }
  if(!data||!data.user) throw new Error('N\xe3o foi poss\xedvel iniciar sess\xe3o.');
  window.__tchiloJustLoggedIn=true;
  try{clearTimeout(window.__tchiloJustLoggedInTimer);}catch(e){}
  window.__tchiloJustLoggedInTimer=setTimeout(function(){window.__tchiloJustLoggedIn=false;},30000);
  var profile=null;
  try{
    var pr=await tchiloSupabase.from('profiles').select('*').eq('id',data.user.id).maybeSingle();
    profile=pr&&pr.data;
  }catch(e1){}
  if(!profile){
    try{profile=await tchiloEnsureProfile(data.user);}catch(e2){console.warn('ensureProfile',e2);}
  }
  if(!profile){
    var meta=data.user.user_metadata||{};
    profile={
      id:data.user.id,
      username:meta.username||('user_'+String(data.user.id).slice(0,8)),
      display_name:meta.display_name||meta.username||'',
      avatar_url:null,
      is_private:false,
      anonymous_mode:false
    };
  }
  setSession({
    id:profile.id,
    username:profile.username,
    email:data.user.email||email,
    displayName:profile.display_name||profile.username,
    avatar:profile.avatar_url||null,
    privateAccount:!!profile.is_private,
    anonymousMode:!!profile.anonymous_mode
  });
  try{
    var g=document.getElementById('loginGate');
    if(g){g.classList.add('hidden');g.style.setProperty('display','none','important');}
    document.body.classList.remove('login-locked');
    document.body.style.overflow='';
  }catch(e3){}
  hideLoginGate();
  try{showToast('Ol\xe1, '+profile.username+'!');}catch(e4){}
}'''
            h2,n=re.subn(pat, new, h, count=1)
            if n:
              h=h2
              changed=True
              print('login function replaced', n)
            else:
              print('login regex failed')
              # fallback: just kill the throw
              for t in [
                "if(profileError || !profile) throw new Error('Perfil da conta n\xe3o encontrado.');",
                "if(profileError || !profile) throw new Error('Perfil da conta não encontrado.');",
              ]:
                if t in h:
                  h=h.replace(t, '/* profile optional - no throw */', 1)
                  changed=True
                  print('throw removed')

          # showLoginGate guard
          if 'if(window.__tchiloJustLoggedIn && !window.__tchiloLoggingOut) return;' not in h:
            old_sg='''function showLoginGate() {
  document.getElementById('loginGate').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.body.classList.add('login-locked');
  tchiloClearLoginFields();
  showLoginHome();
  playLoginVideo();
}'''
            new_sg='''function showLoginGate() {
  if(window.__tchiloJustLoggedIn && !window.__tchiloLoggingOut) return;
  try{
    var ls=JSON.parse(localStorage.getItem('tchilo_session')||'null');
    if(ls&&(ls.id||ls.username)&&!window.__tchiloLoggingOut){
      try{
        document.getElementById('loginGate').classList.add('hidden');
        document.body.classList.remove('login-locked');
        document.body.style.overflow='';
      }catch(e){}
      return;
    }
  }catch(e2){}
  document.getElementById('loginGate').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.body.classList.add('login-locked');
  tchiloClearLoginFields();
  showLoginHome();
  playLoginVideo();
}'''
            if old_sg in h:
              h=h.replace(old_sg, new_sg, 1)
              changed=True
              print('showLoginGate guarded')

          # SIGNED_OUT
          old_so="if(event==='SIGNED_OUT'){\n    window.__tchiloPasswordRecoveryActive = false;\n    clearSession(); showLoginGate(); return;\n  }"
          new_so="if(event==='SIGNED_OUT'){\n    window.__tchiloPasswordRecoveryActive = false;\n    if(window.__tchiloJustLoggedIn) return;\n    clearSession(); showLoginGate(); return;\n  }"
          if old_so in h:
            h=h.replace(old_so, new_so, 1)
            changed=True
            print('SIGNED_OUT guarded')

          # sync: soft ensureProfile
          if 'const profile=await tchiloEnsureProfile(session.user);' in h:
            h=h.replace(
              'const profile=await tchiloEnsureProfile(session.user);',
              "let profile=null;try{profile=await tchiloEnsureProfile(session.user);}catch(eP){} if(!profile){const meta=session.user.user_metadata||{};profile={id:session.user.id,username:meta.username||('user_'+String(session.user.id).slice(0,8)),display_name:meta.display_name||'',avatar_url:null,is_private:false,anonymous_mode:false};}",
              1)
            changed=True
            print('sync soft profile')

          # else branch: don't clear if just logged in
          if 'clearSession();\n      showLoginGate();' in h and '__tchiloJustLoggedIn) return' not in h[h.find('tchiloSyncAuthSession'):h.find('tchiloSyncAuthSession')+800]:
            h=h.replace(
              '''    } else {
      clearSession();
      showLoginGate();
    }''',
              '''    } else {
      if(window.__tchiloJustLoggedIn) return;
      try{var ls=JSON.parse(localStorage.getItem('tchilo_session')||'null');if(ls&&(ls.id||ls.username)){hideLoginGate();return;}}catch(eL){}
      clearSession();
      showLoginGate();
    }''',
              1)
            changed=True
            print('sync else guarded')

          # ensureProfile soft
          if 'if(readError) throw readError;' in h:
            h=h.replace('if(readError) throw readError;', 'if(readError){/* soft */}', 1)
            changed=True
            print('readError soft')
          if 'if(createError) throw createError;' in h:
            h=h.replace('if(createError) throw createError;', 'if(createError){/* soft */ return {id:user.id,username:username,display_name:displayName,avatar_url:null,is_private:false,anonymous_mode:false};}', 1)
            changed=True
            print('createError soft')

          open('index.html','w').write(h)
          print('done', orig, '->', len(h), 'changed', changed)
          print('perfil throw left', 'Perfil da conta' in h)
          print('justLoggedIn', '__tchiloJustLoggedIn' in h)
          PY
      - name: Commit and push
        run: |
          git config user.name "tchilo-bot"
          git config user.email "bot@tchilopop.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No index changes"
          else
            git commit -m "index: FIX LOGIN - perfil opcional, gate guard, sem bounce"
            git push
          fi
