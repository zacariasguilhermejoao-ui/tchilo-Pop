name: Patch SMS final

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply SMS icon from user SVG
        run: |
          # Use the sms-icon.svg if present, else create from known path
          python3 -c "
import re
from pathlib import Path
INDEX = Path('index.html')
content = INDEX.read_text(encoding='utf-8', errors='replace')
sms_btn = '''<div class=\"icon-btn\" onclick=\"goTo(\'messages\')\" title=\"SMS / Mensagens\" aria-label=\"SMS\">
          <img src=\"sms-icon.svg\" alt=\"SMS\" style=\"width:28px;height:28px;object-fit:contain;display:block;\">
        </div>'''
pat = re.compile(r'(<div class=\"topbar-icons\">\\s*)(.*?)(\\s*</div>\\s*</div>\\s*<input type=\"file\" id=\"storyMediaInput\")', re.DOTALL)
m = pat.search(content)
if m and 'sms-icon.svg' not in m.group(2) and 'SMS / Mensagens' not in m.group(2):
    inner = sms_btn + '\\n        ' + m.group(2).strip()
    content = content[:m.start()] + m.group(1) + inner + m.group(3) + content[m.end():]
    print('Added SMS to topbar')
pat2 = re.compile(r'(<button class=\"nav-item\" data-screen=\"messages\"[^>]*>\\s*)<svg[^>]*>.*?</svg>(\\s*<div class=\"dot\"></div>\\s*</button>)', re.DOTALL)
content2, n = pat2.subn(r'\\1<img src=\"sms-icon.svg\" alt=\"SMS\" style=\"width:34px;height:34px;object-fit:contain;display:block;\">\\2', content, count=1)
if n:
    content = content2
    print('Replaced messages icon')
INDEX.write_text(content, encoding='utf-8')
print('done')
"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "SMS: put user icon in topbar + messages nav"
            git push
          fi
