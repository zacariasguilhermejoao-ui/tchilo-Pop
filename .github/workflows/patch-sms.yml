name: Patch SMS icon

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_sms_icon.py'
      - 'sms-icon.svg'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply SMS icon
        run: |
          python3 scripts/patch_sms_icon.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sms-icon.svg
          if ! git diff --cached --quiet; then
            git commit -m "SMS: put user-provided icon in topbar + messages nav (remove old)"
            git push
          fi
