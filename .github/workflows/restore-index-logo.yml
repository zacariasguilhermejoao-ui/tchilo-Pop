name: Restore index logo fix

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore index and strip logo icon-lock
        run: |
          set -e
          curl -sL "https://raw.githubusercontent.com/zacariasguilhermejoao-ui/tchilo-Pop/fbac2be39da89ba56aa8ae954a45c15b54f58e9a/index.html" -o index.html
          python3 << 'PY'
          import re
          data = open("index.html", encoding="utf-8", errors="replace").read()
          data2 = re.sub(
              r"\s*html body \.topbar img\.logo-img\{[^}]*\}",
              "",
              data,
              count=1,
          )
          data2 = data2.replace(",\n      {sel:'.topbar img.logo-img',type:'img'}", "")
          data2 = data2.replace("{sel:'.topbar img.logo-img',type:'img'},", "")
          data2 = data2.replace("{sel:'.topbar img.logo-img',type:'img'}", "")
          open("index.html", "w", encoding="utf-8").write(data2)
          print("len", len(data2))
          print("has height rule", "topbar img.logo-img{height" in data2)
          print("has target", "sel:'.topbar img.logo-img'" in data2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restaurar index: ícone LIVE só do index, sem icon-lock no logo"
            git push
          fi
