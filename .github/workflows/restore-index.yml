name: Restore index.html

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index from good commit + apply LIVE logo
        run: |
          git show 43fb0bcaa2340885dfe21faa819e9c99c0aa03c8:index.html > index.html
          python3 scripts/patch_live_logo.py || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore full index.html + permanent larger LIVE logo (no Tchilo flash)" || echo "no change"
          git push
