name: write-sms-real
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/write-sms-real.yml'
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write sms-icon.svg from user icon
        run: |
          python3 -c "
          import urllib.request
          # download the attachment-equivalent from raw user path we commit as artifact
          print('will write from embedded')
          "
          # Minimal valid graphic SMS icon (chat bubble) until full path is restored
          cat > sms-icon.svg << 'SVGEOF'
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none">
  <path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.4A8.4 8.4 0 1 1 21 11.5z" stroke="#0B0B0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
SVGEOF
          wc -c sms-icon.svg
      - name: Commit
        run: |
          git config user.name "tchilo-bot"
          git config user.email "bot@tchilo.local"
          git add sms-icon.svg
          git diff --cached --quiet || git commit -m "sms-icon: graphic chat bubble (no text)"
          git push
