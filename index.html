<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tchilo</title>
<script>
(function () {
  var GOOD = 'https://cdn.jsdelivr.net/gh/zacariasguilhermejoao-ui/tchilo-Pop@79b2a12409f9465714832fb8f344b1fc37406475/index.html';
  var REELS_BTN =
    '    <button class="nav-item" data-screen="reels" aria-label="Reels" onclick="if(typeof openReels===\'function\')openReels();">' +
    '      <img class="nav-reels-icon" src="native/reels-icon.png" width="26" height="26" alt="Reels" draggable="false" onerror="this.style.display=\'none\'">' +
    '      <div class="dot"></div>' +
    '    </button>';
  var OLD_MSG =
    /<button class="nav-item" data-screen="messages"[\s\S]*?<\/button>/;
  fetch(GOOD, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(OLD_MSG, REELS_BTN);
      if (html.indexOf('nav-reels-icon') === -1) {
        html = html.replace(
          '<script src="native/feed-stable.js"><\/script>',
          '<script src="native/tchilo-reels-icon.js?v=3"><\/script>\n<script src="native/feed-stable.js"><\/script>'
        );
      } else {
        html = html.replace(
          '<script src="native/feed-stable.js"><\/script>',
          '<script src="native/tchilo-reels-icon.js?v=3"><\/script>\n<script src="native/feed-stable.js"><\/script>'
        );
      }
      if (html.indexOf('nav-reels-icon{') === -1) {
        html = html.replace(
          '.icon-btn svg{ width:18px; height:18px; }',
          '.icon-btn svg{ width:18px; height:18px; }\n  .nav-item .nav-reels-icon{ width:26px; height:26px; display:block; object-fit:contain; }'
        );
      }
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      location.href = GOOD;
    });
})();
</script>
</head>
<body>
<p style="font-family:system-ui;padding:24px;text-align:center">A carregar o Tchilo…</p>
</body>
</html>
