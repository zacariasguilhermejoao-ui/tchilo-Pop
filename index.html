<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tchilo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0B0B0C;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: system-ui, sans-serif;
    font-size: 15px;
    z-index: 1;
  }
  iframe {
    border: 0;
    width: 100%;
    height: 100%;
    display: block;
    position: fixed;
    inset: 0;
    z-index: 2;
    background: #0B0B0C;
  }
</style>
</head>
<body>
  <div id="boot">A carregar o Tchilo…</div>
  <iframe
    id="app"
    title="Tchilo"
    src="https://raw.githack.com/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html"
    allow="camera; microphone; geolocation; autoplay; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>
  <script>
    (function () {
      var f = document.getElementById('app');
      var boot = document.getElementById('boot');
      f.addEventListener('load', function () {
        if (boot) boot.style.display = 'none';
      });
      /* Nunca redirecionar a página principal */
      window.addEventListener('beforeunload', function () {});
    })();
  </script>
</body>
</html>
