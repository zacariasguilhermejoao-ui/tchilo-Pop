<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tchilo</title>
<script>
(function () {
  var GOOD = 'https://cdn.jsdelivr.net/gh/zacariasguilhermejoao-ui/tchilo-Pop@79b2a12409f9465714832fb8f344b1fc37406475/index.html';
  fetch(GOOD, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
      var s = document.createElement('script');
      s.src = 'native/tchilo-reels-icon.js?v=3';
      document.body.appendChild(s);
    })
    .catch(function () {
      location.href = GOOD;
    });
})();
</script>
<style id="tchilo-hide-nav-legal">
body.legal-screen-open .navbar, body.legal-from-login .navbar,
body.legal-screen-open .topbar, body.legal-from-login .topbar,
body.legal-screen-open .stories, body.legal-from-login .stories {
  display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;
}
#appFrame:has(#screen-terms.active) .navbar,
#appFrame:has(#screen-privacy.active) .navbar,
#appFrame:has(#screen-child.active) .navbar,
#appFrame:has(#screen-community.active) .navbar,
#appFrame:has(#screen-about.active) .navbar {
  display:none!important;visibility:hidden!important;
}
</style>
</head>
<body>
<p style="font-family:system-ui;padding:24px;text-align:center">A carregar o Tchilo…</p>
<script src="native/legal-navbar-fix.js"></script>
<script src="native/feed-names-fix.js"></script>
</body>
</html>
