<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Tchilo</title>
<style>
html,body{margin:0;min-height:100%;background:#0B0B0C;color:#fff;font-family:system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
a{color:#c8f560;font-weight:700}
</style>
<style id="tchilo-hide-nav-legal">
body.legal-screen-open .navbar, body.legal-from-login .navbar,
body.legal-screen-open .topbar, body.legal-from-login .topbar,
body.legal-screen-open .stories, body.legal-from-login .stories {
  display:none!important;visibility:hidden!important;pointer-events:none!important;opacity:0!important;
}
#appFrame:has(#screen-terms.active) .navbar,
#appFrame:has(#screen-privacy.active) .navbar,
#appFrame:has(#screen-child.active) .navbar,
#appFrame:has(#screen-community.active) .navbar,
#appFrame:has(#screen-about.active) .navbar {
  display:none!important;visibility:hidden!important;
}
</style>
</head>
<body>
<p id="m">A carregar o Tchilo…</p>
<script>
(function () {
  var SRC = 'https://raw.githack.com/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html';
  var FIXES = [
    'native/tchilo-create-buttons.js?v=2',
    'native/tchilo-video-pick.js?v=5',
    'native/tchilo-cloud-force.js?v=1',
    'native/tchilo-name-sync.js?v=1',
    'native/feed-stable.js?v=7'
  ];
  function injectFixes() {
    FIXES.forEach(function (src) {
      try {
        var s = document.createElement('script');
        s.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
        (document.body || document.documentElement).appendChild(s);
      } catch (e) {}
    });
  }
  fetch(SRC, { cache: 'no-store', mode: 'cors' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      if (!html || html.indexOf('screen-feed') < 0) throw new Error('HTML inválido');
      document.open();
      document.write(html);
      document.close();
      setTimeout(injectFixes, 30);
      setTimeout(injectFixes, 400);
      setTimeout(injectFixes, 1200);
    })
    .catch(function (e) {
      var el = document.getElementById('m');
      if (el) el.innerHTML = 'Erro ao carregar.<br><a href="' + SRC + '">Abrir</a>';
    });
})();
</script>
<script src="native/legal-navbar-fix.js"></script>
<script src="native/feed-names-fix.js"></script>
</body>
</html>
