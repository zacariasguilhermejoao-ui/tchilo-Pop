<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tchilo</title>
<script>
(function () {
  var GOOD = 'https://cdn.jsdelivr.net/gh/zacariasguilhermejoao-ui/tchilo-Pop@79b2a12409f9465714832fb8f344b1fc37406475/index.html';
  fetch(GOOD, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
      var s = document.createElement('script');
      s.src = 'native/tchilo-reels-icon.js?v=3';
      document.body.appendChild(s);
    })
    .catch(function () {
      location.href = GOOD;
    });
})();
</script>
</head>
