<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tchilo</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0B0B0C;color:#fff;font-family:system-ui,sans-serif;}
  #boot{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px;}
  #boot p{opacity:.8;font-size:15px;}
  #frame{border:0;width:100%;height:100%;display:none;position:fixed;inset:0;}
</style>
</head>
<body>
<div id="boot"><p>A carregar o Tchilo…</p></div>
<iframe id="frame" title="Tchilo" allow="camera; microphone; geolocation; autoplay; clipboard-read; clipboard-write"></iframe>
<script>
(function () {
  /* Última versão completa estável do index.html */
  var SOURCES = [
    'https://cdn.jsdelivr.net/gh/zacariasguilhermejoao-ui/tchilo-Pop@79b2a12409f9465714832fb8f344b1fc37406475/index.html',
    'https://raw.githack.com/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html',
    'https://gitcdn.link/repo/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html'
  ];

  function showError() {
    document.getElementById('boot').innerHTML =
      '<p>Não foi possível carregar o Tchilo.</p>' +
      '<p style="margin-top:12px"><a style="color:#c8f560" href="' + SOURCES[0] + '">Abrir versão de emergência</a></p>';
  }

  function tryFetch(i) {
    if (i >= SOURCES.length) {
      showError();
      return;
    }
    var url = SOURCES[i];
    fetch(url, { cache: 'no-store', mode: 'cors' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        if (!html || html.indexOf('Tchilo') < 0 && html.indexOf('feedList') < 0 && html.indexOf('screen-feed') < 0) {
          throw new Error('HTML inválido');
        }
        /* Reescreve no mesmo documento (melhor que iframe para auth/storage) */
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        tryFetch(i + 1);
      });
  }

  tryFetch(0);
})();
</script>
</body>
</html>
