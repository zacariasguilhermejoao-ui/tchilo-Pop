<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Tchilo</title>
<style>
html,body{margin:0;min-height:100%;background:#0B0B0C;color:#fff;font-family:system-ui,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
a{color:#c8f560;font-weight:700}
</style>
</head>
<body>
<p id="m">A carregar o Tchilo…</p>
<script>
(function () {
  var SRC = 'https://raw.githack.com/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html';
  var FIXES = [
    'native/tchilo-video-pick.js?v=5',
    'native/tchilo-cloud-force.js?v=1',
    'native/tchilo-gallery-force.js?v=3',
    'native/tchilo-name-sync.js?v=1',
    'native/feed-stable.js?v=6'
  ];
  function injectFixes() {
    FIXES.forEach(function (src) {
      try {
        var s = document.createElement('script');
        s.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
        s.async = false;
        (document.body || document.documentElement).appendChild(s);
      } catch (e) {}
    });
  }
  fetch(SRC, { cache: 'no-store', mode: 'cors' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      if (!html || (html.indexOf('screen-feed') < 0 && html.indexOf('feedList') < 0)) {
        throw new Error('HTML inválido');
      }
      document.open();
      document.write(html);
      document.close();
      setTimeout(injectFixes, 30);
      setTimeout(injectFixes, 400);
      setTimeout(injectFixes, 1200);
    })
    .catch(function (e) {
      var el = document.getElementById('m');
      if (el) {
        el.innerHTML =
          'Erro ao carregar.<br><br><a href="' + SRC + '">Abrir Tchilo</a><br><small>' +
          (e && e.message ? e.message : e) + '</small>';
      }
    });
})();
</script>
</body>
</html>
