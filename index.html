<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tchilo</title>
<style>
  html,body{margin:0;min-height:100%;background:#0B0B0C;color:#fff;font-family:system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  a{color:#c8f560;font-weight:700}
</style>
</head>
<body>
<p id="m">A carregar o Tchilo…</p>
<script>
(function () {
  var URLS = [
    'https://raw.githack.com/zacariasguilhermejoao-ui/tchilo-Pop/79b2a12409f9465714832fb8f344b1fc37406475/index.html',
    'https://cdn.jsdelivr.net/gh/zacariasguilhermejoao-ui/tchilo-Pop@79b2a12409f9465714832fb8f344b1fc37406475/index.html'
  ];
  function fail() {
    document.getElementById('m').innerHTML =
      'Não foi possível carregar.<br><br>' +
      '<a href="' + URLS[0] + '">Abrir Tchilo</a>';
  }
  function tryLoad(i) {
    if (i >= URLS.length) { fail(); return; }
    fetch(URLS[i], { cache: 'no-store', mode: 'cors' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        if (!html || html.indexOf('screen-feed') < 0 && html.indexOf('feedList') < 0) {
          throw new Error('HTML inválido');
        }
        /* Escreve a app completa nesta página — sem redirecionar */
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        tryLoad(i + 1);
      });
  }
  tryLoad(0);
})();
</script>
</body>
</html>
