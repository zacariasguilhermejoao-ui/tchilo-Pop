<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Redefinir palavra-passe · Tchilo</title>
  <meta name="robots" content="noindex">
  <style>
    html,body{margin:0;min-height:100%;background:#0B0B0C;color:#fff;
      font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
    .box{text-align:center;padding:24px;max-width:320px}
    .mark{width:64px;height:64px;border-radius:16px;background:#c8f560;color:#0B0B0C;
      font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    p{opacity:.8;font-size:14px;line-height:1.45}
  </style>
  <script>
  (function () {
    try { sessionStorage.setItem('tchilo_password_recovery', '1'); } catch (e) {}
    var hash = window.location.hash || '';
    var search = window.location.search || '';
    if (!hash && search.indexOf('type=recovery') < 0) {
      hash = '#type=recovery';
    }
    /* App instalado: tentar scheme nativo (fallback se App Links falhar) */
    try {
      var deep = 'tchilo://redefinir-senha' + (search || '') + (hash || '');
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deep;
      document.documentElement.appendChild(iframe);
      setTimeout(function () {
        try { iframe.remove(); } catch (e) {}
      }, 800);
    } catch (e2) {}
    setTimeout(function () {
      window.location.replace('/' + (search || '') + (hash || '#type=recovery'));
    }, 400);
  })();
  </script>
</head>
<body>
  <div class="box">
    <div class="mark">T</div>
    <p>A abrir a página para definir a nova palavra-passe…</p>
  </div>
</body>
</html>
