<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Redefinir palavra-passe · Tchilo</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0B0C">
  <style>
    html,body{margin:0;min-height:100%;background:#0B0B0C;color:#fff;
      font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
    .box{text-align:center;padding:28px 24px;max-width:340px}
    .mark{width:64px;height:64px;border-radius:16px;background:#c8f560;color:#0B0B0C;
      font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    h1{font-size:18px;font-weight:800;margin:0 0 8px}
    p{opacity:.75;font-size:14px;line-height:1.45;margin:0 0 16px}
    .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#c8f560;
      border-radius:50%;margin:12px auto 0;animation:s .7s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
  <script>
  (function () {
    try { sessionStorage.setItem('tchilo_password_recovery', '1'); } catch (e) {}
    try { sessionStorage.setItem('tchilo_password_recovery_ts', String(Date.now())); } catch (e2) {}

    var hash = window.location.hash || '';
    var search = window.location.search || '';

    try {
      if (hash) sessionStorage.setItem('tchilo_recovery_hash', hash);
      if (search) sessionStorage.setItem('tchilo_recovery_search', search);
    } catch (e3) {}

    if (!hash && search.indexOf('type=recovery') < 0 && search.indexOf('access_token') < 0) {
      hash = '#type=recovery';
    }

    var target = '/' + (search || '') + (hash || '#type=recovery');

    try {
      var deep = 'tchilo://redefinir-senha' + (search || '') + (hash || '');
      var a = document.createElement('a');
      a.style.display = 'none';
      a.href = deep;
      document.documentElement.appendChild(a);
      a.click();
      setTimeout(function () { try { a.remove(); } catch (e) {} }, 500);
    } catch (e4) {}

    setTimeout(function () {
      window.location.replace(target);
    }, 250);
  })();
  </script>
</head>
<body>
  <div class="box">
    <div class="mark">T</div>
    <h1>Tchilo</h1>
    <p>A abrir o ecrã para defineires a nova palavra-passe…</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
</body>
</html>
