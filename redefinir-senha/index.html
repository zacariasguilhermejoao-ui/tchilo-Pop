<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Redefinir palavra-passe · Tchilo</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0B0C">
  <style>
    html,body{margin:0;min-height:100%;background:#0B0B0C;color:#fff;
      font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
    .box{text-align:center;padding:28px 24px;max-width:340px}
    .mark{width:64px;height:64px;border-radius:16px;background:#c8f560;color:#0B0B0C;
      font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    p{opacity:.75;font-size:14px;line-height:1.45;margin:0}
  </style>
  <script>
  /* Redirect IMEDIATO — sem esperar */
  (function () {
    try { sessionStorage.setItem('tchilo_password_recovery', '1'); } catch (e) {}
    var hash = location.hash || '';
    var search = location.search || '';
    try {
      if (hash) sessionStorage.setItem('tchilo_recovery_hash', hash);
      if (search) sessionStorage.setItem('tchilo_recovery_search', search);
    } catch (e2) {}
    if (!hash && search.indexOf('access_token') < 0 && search.indexOf('type=recovery') < 0) {
      hash = '#type=recovery';
    }
    location.replace('/' + (search || '') + (hash || '#type=recovery'));
  })();
  </script>
</head>
<body>
  <div class="box">
    <div class="mark">T</div>
    <p>A abrir…</p>
  </div>
</body>
</html>
